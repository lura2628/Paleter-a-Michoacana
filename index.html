<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Michoacana Pro - Corte de Caja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes pulse-red { 0%, 100% { background-color: #ef4444; } 50% { background-color: #f87171; } }
        .animate-alert { animation: pulse-red 1.5s infinite; }
        .cart-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 40px 40px 0 0; }
        .cart-hidden { transform: translateY(calc(100% - 70px)); }
        input[type=number]::-webkit-inner-spin-button { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans select-none text-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [products, setProducts] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [tickets, setTickets] = useState([]);
            const [cortes, setCortes] = useState([]);
            const [categories] = useState(['Paletas', 'Nieve', 'Trolly', 'Venta Libre']);
            const [cart, setCart] = useState([]);
            const [discountPct, setDiscountPct] = useState(0);
            const [catActiva, setCatActiva] = useState('Paletas');
            const [tipoVenta, setTipoVenta] = useState('Venta');
            const [showCart, setShowCart] = useState(false);
            const [pagoCon, setPagoCon] = useState('');

            useEffect(() => {
                const config = JSON.parse(localStorage.getItem('fb_config'));
                if (config && !firebase.apps.length) {
                    const app = firebase.initializeApp(config);
                    setDb(app.firestore());
                }
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsubProds = db.collection('productos').onSnapshot(s => setProducts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubEmps = db.collection('empleados').onSnapshot(s => setEmployees(s.docs.map(d => ({id:d.id, ...d.data()}))));
                
                // Solo cargar tickets que NO han sido cortados
                const unsubTickets = db.collection('tickets').where('cortado', '==', false).onSnapshot(s => setTickets(s.docs.map(d => ({id:d.id, ...d.data()}))));
                
                // Cargar historial de cortes
                const unsubCortes = db.collection('cortes').orderBy('timestamp', 'desc').limit(10).onSnapshot(s => setCortes(s.docs.map(d => ({id:d.id, ...d.data()}))));
                
                return () => { unsubProds(); unsubEmps(); unsubTickets(); unsubCortes(); };
            }, [db]);

            const subtotal = cart.reduce((a, b) => a + (Number(b.precio) * b.qty), 0);
            const totalFinal = tipoVenta === 'Venta' ? Math.round(subtotal * (1 - discountPct / 100)) : 0;
            const cambio = pagoCon ? Number(pagoCon) - totalFinal : 0;
            const totalCajaActual = tickets.filter(t=>t.tipo==='Venta').reduce((a,b)=>a+b.total, 0);

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => item.id === id ? { ...item, qty: Math.max(1, item.qty + delta) } : item));
            };

            const finalizarOperacion = async () => {
                const batch = db.batch();
                const tRef = db.collection('tickets').doc();
                batch.set(tRef, {
                    vendedor: user.nombre, items: cart, total: totalFinal, tipo: tipoVenta, 
                    descuento: discountPct, cortado: false,
                    hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                cart.forEach(item => { if(item.id !== 'libre') batch.update(db.collection('productos').doc(item.id), { stock: firebase.firestore.FieldValue.increment(-item.qty) }); });
                await batch.commit();
                setCart([]); setDiscountPct(0); setTipoVenta('Venta'); setShowCart(false); setPagoCon('');
            };

            const hacerCorteCaja = async () => {
                if(!confirm(`¿Deseas cerrar la caja con $${totalCajaActual}? Esto reiniciará las ventas del menú.`)) return;
                
                const batch = db.batch();
                const cRef = db.collection('cortes').doc();
                
                // Guardar el resumen del corte
                batch.set(cRef, {
                    fecha: new Date().toLocaleDateString(),
                    hora: new Date().toLocaleTimeString(),
                    total_efectivo: totalCajaActual,
                    responsable: user.nombre,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Marcar todos los tickets actuales como cortados
                tickets.forEach(t => {
                    batch.update(db.collection('tickets').doc(t.id), { cortado: true });
                });

                await batch.commit();
                alert("Corte realizado con éxito. Caja en $0.");
            };

            if (view === 'login') return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-pink-100 p-6">
                    <h1 className="text-6xl font-black text-pink-600 mb-10 italic uppercase tracking-tighter text-center">Michoacana</h1>
                    <div className="grid grid-cols-2 gap-4 w-full max-w-md">
                        {employees.map(e => (
                            <button key={e.id} onClick={() => {
                                const p = prompt(`PIN para ${e.nombre}:`);
                                if(p === e.pin) { setUser(e); setView('pos'); }
                            }} className="bg-white p-8 rounded-[40px] shadow-xl font-black uppercase text-gray-700 active:scale-95">
                                {e.nombre}
                                <p className="text-[10px] text-pink-400 font-bold">{e.rol}</p>
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen max-w-5xl mx-auto bg-white shadow-2xl overflow-hidden relative">
                    <nav className="bg-pink-600 p-4 text-white flex justify-between items-center z-30 shadow-md">
                        <span className="font-black italic uppercase text-2xl">Michoacana</span>
                        <div className="flex gap-5 items-center">
                            <button onClick={() => setView('pos')} className="text-3xl">🛒</button>
                            {(user.rol === 'admin' || user.rol === 'encargado') && <button onClick={() => setView('history')} className="text-3xl">📊</button>}
                            {user.rol === 'admin' && <button onClick={() => setView('admin')} className="text-3xl">📦</button>}
                            <button onClick={() => {setUser(null); setView('login');}} className="bg-pink-800 text-white px-4 py-2 rounded-full text-[10px] font-black uppercase">SALIR</button>
                        </div>
                    </nav>

                    {view === 'pos' && (
                        <div className="flex flex-col flex-1 overflow-hidden">
                            <div className="bg-slate-100 flex overflow-x-auto p-2 gap-2 border-b">
                                {categories.map(cat => (
                                    <button key={cat} onClick={() => setCatActiva(cat)} className={`px-6 py-3 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap ${catActiva === cat ? 'bg-pink-600 text-white shadow-lg' : 'bg-white text-gray-400'}`}>
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            <div className="flex-1 p-4 overflow-y-auto bg-slate-50 grid grid-cols-2 sm:grid-cols-3 gap-4 content-start pb-32">
                                {products.filter(p => p.categoria === catActiva).map(p => (
                                    <button key={p.id} disabled={p.stock <= 0} onClick={() => {
                                        setCart(prev => {
                                            const ex = prev.find(i => i.id === p.id);
                                            if(ex) return prev.map(i => i.id === p.id ? {...i, qty: i.qty+1} : i);
                                            return [...prev, {...p, qty: 1}];
                                        });
                                        setShowCart(true);
                                    }} className="p-5 rounded-[35px] shadow-sm bg-white border-4 border-transparent active:border-pink-500 relative text-left">
                                        <p className="font-black text-gray-900 leading-tight uppercase text-sm mb-1">{p.nombre}</p>
                                        <p className="text-pink-600 font-black text-2xl">${p.precio}</p>
                                        <div className={`absolute top-3 right-3 px-2 py-0.5 rounded-full text-[9px] font-black uppercase ${p.stock <= 10 ? 'animate-alert text-white' : 'bg-pink-50 text-pink-300'}`}>
                                            {p.stock}
                                        </div>
                                    </button>
                                ))}
                            </div>

                            <div className={`cart-panel fixed bottom-0 left-0 right-0 bg-white shadow-[0_-15px_40px_rgba(0,0,0,0.15)] z-40 flex flex-col max-h-[90vh] ${!showCart ? 'cart-hidden' : ''}`}>
                                <button onClick={() => setShowCart(!showCart)} className="w-full py-4 flex flex-col items-center">
                                    <div className="w-16 h-1.5 bg-slate-200 rounded-full mb-2"></div>
                                    <span className="font-black text-[10px] text-pink-500 uppercase tracking-widest">
                                        {showCart ? 'Bajar Panel' : `Ver Carrito ($${totalFinal})`}
                                    </span>
                                </button>
                                
                                <div className="p-6 overflow-y-auto flex-1 bg-white">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center mb-4 bg-slate-50 p-4 rounded-3xl border">
                                            <div className="flex-1 pr-2">
                                                <p className="font-black text-sm uppercase text-slate-700 leading-tight">{item.nombre}</p>
                                                <p className="text-pink-500 font-bold text-xs">${item.precio} c/u</p>
                                            </div>
                                            <div className="flex items-center gap-3 bg-white p-2 rounded-2xl shadow-sm border">
                                                <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 font-black text-xl text-red-400">-</button>
                                                <span className="font-black text-lg w-6 text-center">{item.qty}</span>
                                                <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 font-black text-xl text-green-400">+</button>
                                            </div>
                                        </div>
                                    ))}
                                    
                                    <div className="mt-4 p-5 bg-slate-100 rounded-[35px] space-y-5">
                                        <div className="flex items-center justify-between">
                                            {(user.rol === 'admin' || user.rol === 'encargado') && (
                                                <select value={tipoVenta} onChange={(e)=>setTipoVenta(e.target.value)} className="bg-white px-4 py-3 rounded-2xl font-black text-[11px] uppercase text-pink-600 outline-none border shadow-sm">
                                                    <option value="Venta">💰 Venta</option>
                                                    <option value="Merma">🚫 Merma</option>
                                                    <option value="Consumo">🍦 Consumo</option>
                                                </select>
                                            )}
                                            {tipoVenta === 'Venta' && (
                                                <div className="flex gap-1">
                                                    {[0, 10, 30].map(pct => (
                                                        <button key={pct} onClick={() => setDiscountPct(pct)} className={`px-4 py-2 rounded-xl font-black text-[11px] border transition-all ${discountPct===pct?'bg-pink-600 text-white':'bg-white text-slate-400'}`}>{pct}%</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex justify-between items-end border-b-2 border-slate-200 pb-4 px-2">
                                            <div className="flex flex-col">
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total</span>
                                                <span className="text-6xl font-black text-slate-800 tracking-tighter">${totalFinal}</span>
                                            </div>
                                        </div>

                                        {tipoVenta === 'Venta' && (
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="flex flex-col">
                                                    <label className="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 tracking-widest">Paga con:</label>
                                                    <input type="number" value={pagoCon} onChange={(e)=>setPagoCon(e.target.value)} placeholder="0" className="w-full p-4 bg-white rounded-2xl font-black text-2xl text-slate-800 shadow-inner outline-none border-2 border-transparent focus:border-pink-300" />
                                                </div>
                                                <div className="flex flex-col">
                                                    <span className="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 tracking-widest">Cambio:</span>
                                                    <div className={`w-full p-4 rounded-2xl font-black text-2xl flex items-center justify-center shadow-sm ${cambio < 0 ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-600'}`}>
                                                        ${cambio >= 0 ? cambio : '...'}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <button onClick={finalizarOperacion} disabled={cart.length===0} className="w-full py-6 rounded-[30px] bg-pink-600 text-white font-black text-3xl shadow-xl shadow-pink-200 uppercase active:scale-95 transition-all">FINALIZAR ✅</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'history' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100">
                            <div className="bg-pink-600 p-8 rounded-[50px] mb-8 text-white text-center shadow-2xl relative overflow-hidden">
                                <p className="text-[10px] font-black opacity-70 uppercase mb-2 tracking-widest">Efectivo en Caja Actual</p>
                                <p className="text-8xl font-black tracking-tighter leading-none mb-6">${totalCajaActual}</p>
                                
                                {user.rol === 'admin' && (
                                    <button onClick={hacerCorteCaja} className="bg-white text-pink-600 px-8 py-4 rounded-3xl font-black uppercase text-sm shadow-xl active:scale-95">
                                        Realizar Corte de Caja 💰
                                    </button>
                                )}
                            </div>

                            <div className="space-y-4 pb-20">
                                <h3 className="font-black uppercase text-slate-400 text-xs ml-4">Ventas del turno actual</h3>
                                {tickets.sort((a,b)=>b.timestamp-a.timestamp).map(t => (
                                    <div key={t.id} className="bg-white p-7 rounded-[40px] shadow-sm border-r-[15px] border-green-500">
                                        <p className="font-black text-gray-800 text-lg uppercase italic leading-none">{t.hora} • {t.vendedor}</p>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase mt-2">{t.items.map(i=>`${i.nombre}(x${i.qty})`).join(', ')}</p>
                                        <p className="text-4xl font-black text-slate-800 mt-3 tracking-tighter">${t.total}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'admin' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100 space-y-8 pb-10">
                            {/* HISTORIAL DE CORTES */}
                            <div className="bg-white p-8 rounded-[40px] shadow-sm">
                                <h2 className="text-xl font-black uppercase italic text-pink-600 mb-6 flex items-center gap-2">📑 Historial de Cortes</h2>
                                <div className="space-y-3">
                                    {cortes.map(c => (
                                        <div key={c.id} className="p-5 bg-slate-50 rounded-3xl border border-slate-200 flex justify-between items-center">
                                            <div>
                                                <p className="font-black text-slate-800">{c.fecha} - {c.hora}</p>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase">Corte hecho por: {c.responsable}</p>
                                            </div>
                                            <p className="text-3xl font-black text-green-600">${c.total_efectivo}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* INVENTARIO */}
                            <div className="bg-white p-8 rounded-[40px] shadow-sm">
                                <h2 className="text-xl font-black uppercase italic text-pink-600 mb-6">📦 Inventario</h2>
                                {products.map(p => (
                                    <div key={p.id} className="bg-slate-50 p-5 rounded-3xl mb-4 flex justify-between items-center">
                                        <div className="flex-1">
                                            <p className="font-black uppercase text-sm">{p.nombre}</p>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase">{p.categoria}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <div className="text-center">
                                                <p className="text-[8px] font-black uppercase text-slate-400">Precio</p>
                                                <input type="number" defaultValue={p.precio} onBlur={(e)=>db.collection('productos').doc(p.id).update({precio: Number(e.target.value)})} className="w-16 p-2 bg-white border rounded-xl font-black text-center text-pink-600" />
                                            </div>
                                            <div className="text-center">
                                                <p className="text-[8px] font-black uppercase text-slate-400">Stock</p>
                                                <input type="number" defaultValue={p.stock} onBlur={(e)=>db.collection('productos').doc(p.id).update({stock: Number(e.target.value)})} className="w-16 p-2 bg-white border rounded-xl font-black text-center" />
                                            </div>
                                            <button onClick={() => confirm("¿Eliminar?") && db.collection('productos').doc(p.id).delete()} className="text-red-300 font-black px-2">✕</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
