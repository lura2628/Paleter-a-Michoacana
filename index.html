<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Michoacana Pro Control V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes pulse-red { 0%, 100% { background-color: #ef4444; } 50% { background-color: #f87171; } }
        .animate-alert { animation: pulse-red 1.5s infinite; }
        .cart-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 40px 40px 0 0; }
        .cart-hidden { transform: translateY(calc(100% - 70px)); }
        input[type=number]::-webkit-inner-spin-button { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans select-none text-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [products, setProducts] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [tickets, setTickets] = useState([]);
            const [categories, setCategories] = useState(['Paletas', 'Nieve', 'Trolly', 'Venta Libre']);
            const [cart, setCart] = useState([]);
            const [discountPct, setDiscountPct] = useState(0);
            const [catActiva, setCatActiva] = useState('Paletas');
            const [tipoVenta, setTipoVenta] = useState('Venta');
            const [showCart, setShowCart] = useState(false);
            const [pagoCon, setPagoCon] = useState('');

            useEffect(() => {
                const config = JSON.parse(localStorage.getItem('fb_config'));
                if (config && !firebase.apps.length) {
                    const app = firebase.initializeApp(config);
                    setDb(app.firestore());
                }
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsubProds = db.collection('productos').onSnapshot(s => setProducts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubEmps = db.collection('empleados').onSnapshot(s => setEmployees(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubCats = db.collection('config').doc('categorias').onSnapshot(doc => doc.exists && setCategories(doc.data().lista));
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                const unsubTickets = db.collection('tickets').where('timestamp', '>=', hoy).onSnapshot(s => setTickets(s.docs.map(d => ({id:d.id, ...d.data()}))));
                return () => { unsubProds(); unsubEmps(); unsubCats(); unsubTickets(); };
            }, [db]);

            const subtotal = cart.reduce((a, b) => a + (Number(b.precio) * b.qty), 0);
            const totalFinal = tipoVenta === 'Venta' ? Math.round(subtotal * (1 - discountPct / 100)) : 0;
            const cambio = pagoCon ? Number(pagoCon) - totalFinal : 0;

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => 
                    item.id === id ? { ...item, qty: Math.max(1, item.qty + delta) } : item
                ));
            };

            const finalizarOperacion = async () => {
                const batch = db.batch();
                const tRef = db.collection('tickets').doc();
                batch.set(tRef, {
                    vendedor: user.nombre, items: cart, total: totalFinal, tipo: tipoVenta, valor_merma: tipoVenta !== 'Venta' ? subtotal : 0,
                    hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                cart.forEach(item => { if(item.id !== 'libre') batch.update(db.collection('productos').doc(item.id), { stock: firebase.firestore.FieldValue.increment(-item.qty) }); });
                await batch.commit();
                setCart([]); setDiscountPct(0); setTipoVenta('Venta'); setShowCart(false); setPagoCon('');
            };

            if (view === 'login') return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-pink-100 p-6">
                    <h1 className="text-6xl font-black text-pink-600 mb-10 italic uppercase tracking-tighter drop-shadow-lg text-center leading-none">Michoacana</h1>
                    <div className="grid grid-cols-2 gap-4 w-full max-w-md">
                        {employees.map(e => (
                            <button key={e.id} onClick={() => {
                                const p = prompt(`PIN para ${e.nombre}:`);
                                if(p === e.pin) { setUser(e); setView('pos'); }
                            }} className="bg-white p-8 rounded-[40px] shadow-xl font-black uppercase text-gray-700 active:scale-95 transition-all">
                                {e.nombre}
                                <p className="text-[10px] text-pink-400 font-bold tracking-widest">{e.rol}</p>
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen max-w-5xl mx-auto bg-white shadow-2xl overflow-hidden relative">
                    <nav className="bg-pink-600 p-4 text-white flex justify-between items-center z-30 shadow-md">
                        <span className="font-black italic uppercase text-2xl">Michoacana</span>
                        <div className="flex gap-5 items-center">
                            <button onClick={() => setView('pos')} className="text-3xl">🛒</button>
                            {(user.rol === 'admin' || user.rol === 'encargado') && <button onClick={() => setView('history')} className="text-3xl">📊</button>}
                            {user.rol === 'admin' && <button onClick={() => setView('admin')} className="text-3xl">📦</button>}
                            <button onClick={() => {setUser(null); setView('login');}} className="bg-pink-800 text-white px-4 py-2 rounded-full text-[10px] font-black uppercase">SALIR</button>
                        </div>
                    </nav>

                    {view === 'pos' && (
                        <div className="flex flex-col flex-1 overflow-hidden">
                            <div className="bg-slate-100 flex overflow-x-auto p-2 gap-2 border-b shadow-inner">
                                {categories.map(cat => (
                                    <button key={cat} onClick={() => setCatActiva(cat)} className={`px-6 py-3 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap transition-all ${catActiva === cat ? 'bg-pink-600 text-white shadow-lg' : 'bg-white text-gray-400'}`}>
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            <div className="flex-1 p-4 overflow-y-auto bg-slate-50 grid grid-cols-2 sm:grid-cols-3 gap-4 content-start pb-32">
                                {products.filter(p => p.categoria === catActiva).map(p => (
                                    <button key={p.id} disabled={p.stock <= 0} onClick={() => {
                                        setCart(prev => {
                                            const ex = prev.find(i => i.id === p.id);
                                            if(ex) return prev.map(i => i.id === p.id ? {...i, qty: i.qty+1} : i);
                                            return [...prev, {...p, qty: 1}];
                                        });
                                        setShowCart(true);
                                    }} className="p-5 rounded-[35px] shadow-sm bg-white border-4 border-transparent active:border-pink-500 relative text-left transition-all">
                                        <p className="font-black text-gray-900 leading-tight uppercase text-sm mb-1">{p.nombre}</p>
                                        <p className="text-pink-600 font-black text-2xl">${p.precio}</p>
                                        <div className={`absolute top-3 right-3 px-2 py-0.5 rounded-full text-[9px] font-black uppercase ${p.stock <= 15 ? 'animate-alert text-white' : 'bg-pink-50 text-pink-300'}`}>
                                            Stock: {p.stock}
                                        </div>
                                    </button>
                                ))}
                            </div>

                            {/* PANEL DE CARRITO DESLIZABLE */}
                            <div className={`cart-panel fixed bottom-0 left-0 right-0 bg-white shadow-[0_-15px_40px_rgba(0,0,0,0.15)] z-40 flex flex-col max-h-[90vh] ${!showCart ? 'cart-hidden' : ''}`}>
                                <button onClick={() => setShowCart(!showCart)} className="w-full py-4 flex flex-col items-center bg-white rounded-t-[40px]">
                                    <div className="w-16 h-1.5 bg-slate-200 rounded-full mb-2"></div>
                                    <span className="font-black text-[10px] text-pink-500 uppercase tracking-widest leading-none">
                                        {showCart ? 'Bajar para ver productos' : `🛒 ${cart.length} productos en carrito`}
                                    </span>
                                </button>
                                
                                <div className="p-6 overflow-y-auto flex-1 bg-white">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center mb-4 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                                            <div className="flex-1">
                                                <p className="font-black text-sm uppercase text-slate-700 leading-tight">{item.nombre}</p>
                                                <p className="text-pink-500 font-bold text-xs">${item.precio} c/u</p>
                                            </div>
                                            <div className="flex items-center gap-3 bg-white p-2 rounded-2xl shadow-sm border">
                                                <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 font-black text-xl text-red-400">-</button>
                                                <span className="font-black text-lg w-6 text-center">{item.qty}</span>
                                                <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 font-black text-xl text-green-400">+</button>
                                            </div>
                                            <button onClick={() => setCart(prev => prev.filter(i => i.id !== item.id))} className="ml-4 text-red-300 font-black text-xl">✕</button>
                                        </div>
                                    ))}
                                    
                                    <div className="mt-4 p-5 bg-slate-100 rounded-[35px] space-y-5">
                                        <div className="flex justify-between items-center gap-2">
                                            {(user.rol === 'admin' || user.rol === 'encargado') ? (
                                                <select value={tipoVenta} onChange={(e)=>setTipoVenta(e.target.value)} className="bg-white px-4 py-3 rounded-2xl font-black text-[10px] uppercase text-pink-600 outline-none border shadow-sm">
                                                    <option value="Venta">💰 Venta Normal</option>
                                                    <option value="Merma">🚫 Merma (Dañado)</option>
                                                </select>
                                            ) : <div className="font-black text-[10px] uppercase text-slate-400 ml-2">Venta Directa</div>}
                                            
                                            {tipoVenta === 'Venta' && (
                                                <div className="flex gap-1">
                                                    {[0, 10, 20].map(pct => (
                                                        <button key={pct} onClick={() => setDiscountPct(pct)} className={`px-4 py-2 rounded-xl font-black text-[10px] border transition-all ${discountPct===pct?'bg-pink-600 text-white shadow-md':'bg-white text-slate-400'}`}>{pct}%</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex justify-between items-end border-b-2 border-slate-200 pb-4">
                                            <div className="flex flex-col italic">
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1">Total a cobrar</span>
                                                <span className="text-6xl font-black text-slate-800 tracking-tighter">${totalFinal}</span>
                                            </div>
                                            {tipoVenta !== 'Venta' && <span className="bg-orange-500 text-white text-[9px] px-3 py-1 rounded-full font-black uppercase mb-2">MERMA</span>}
                                        </div>

                                        {/* CALCULADORA DE CAMBIO */}
                                        {tipoVenta === 'Venta' && (
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="flex flex-col">
                                                    <label className="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 tracking-widest">¿Con cuánto pagan?</label>
                                                    <input type="number" value={pagoCon} onChange={(e)=>setPagoCon(e.target.value)} placeholder="0.00" className="w-full p-4 bg-white rounded-2xl font-black text-2xl text-slate-800 shadow-inner border-2 border-transparent focus:border-pink-300 outline-none" />
                                                </div>
                                                <div className="flex flex-col">
                                                    <span className="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 tracking-widest">Cambio a dar</span>
                                                    <div className={`w-full p-4 rounded-2xl font-black text-2xl flex items-center justify-center ${cambio < 0 ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-600'}`}>
                                                        ${cambio >= 0 ? cambio : 'Faltan ' + Math.abs(cambio)}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <button onClick={finalizarOperacion} disabled={cart.length===0} className="w-full py-6 rounded-[30px] bg-pink-600 text-white font-black text-3xl shadow-xl shadow-pink-200 uppercase active:scale-95 transition-all">FINALIZAR COBRO</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'admin' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100 space-y-8 pb-10">
                            {/* GESTIÓN DE EMPLEADOS */}
                            <div className="bg-white p-8 rounded-[40px] shadow-sm">
                                <h2 className="text-xl font-black uppercase italic text-pink-600 mb-6 flex items-center gap-2">👥 Gestión de Personal</h2>
                                <div className="space-y-3">
                                    {employees.map(e => (
                                        <div key={e.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-3xl border">
                                            <div>
                                                <p className="font-black uppercase text-sm">{e.nombre}</p>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{e.rol} • PIN: {e.pin}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => {
                                                    const nNom = prompt("Nuevo nombre:", e.nombre);
                                                    const nPin = prompt("Nuevo PIN:", e.pin);
                                                    const nRol = prompt("Puesto (admin/encargado/vendedor):", e.rol);
                                                    if(nNom && nPin && nRol) db.collection('empleados').doc(e.id).update({nombre: nNom.toUpperCase(), pin: nPin, rol: nRol});
                                                }} className="bg-blue-100 text-blue-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase">Editar</button>
                                                <button onClick={() => confirm("¿Eliminar?") && db.collection('empleados').doc(e.id).delete()} className="text-red-300 font-black px-2">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => {
                                        const n = prompt("Nombre:"); const p = prompt("PIN:"); const r = prompt("Puesto:");
                                        if(n && p && r) db.collection('empleados').add({nombre: n.toUpperCase(), pin: p, rol: r});
                                    }} className="w-full py-4 rounded-3xl border-2 border-dashed border-pink-200 text-pink-500 font-black uppercase text-xs hover:bg-pink-50">+ Agregar Empleado</button>
                                </div>
                            </div>

                            {/* INVENTARIO */}
                            <div className="bg-white p-8 rounded-[40px] shadow-sm">
                                <h2 className="text-xl font-black uppercase italic text-pink-600 mb-6 flex items-center gap-2">📦 Editar Sabores y Stock</h2>
                                <div className="space-y-4">
                                    {products.sort((a,b)=>a.stock-b.stock).map(p => (
                                        <div key={p.id} className="bg-slate-50 p-5 rounded-3xl border border-slate-100 flex flex-col sm:flex-row justify-between gap-4 transition-all hover:bg-white">
                                            <div className="flex-1">
                                                <p className="font-black uppercase text-[9px] text-slate-400 tracking-widest mb-1">{p.categoria}</p>
                                                <p className="font-black text-lg uppercase leading-none">{p.nombre}</p>
                                            </div>
                                            <div className="flex gap-3 items-center">
                                                <div className="text-center">
                                                    <p className="text-[8px] font-black uppercase text-slate-400 mb-1">Precio $</p>
                                                    <input type="number" defaultValue={p.precio} onBlur={(e)=>db.collection('productos').doc(p.id).update({precio: Number(e.target.value)})} className="w-16 p-2 bg-white border rounded-xl font-black text-center text-pink-600 shadow-sm outline-none focus:ring-2 ring-pink-200" />
                                                </div>
                                                <div className="text-center">
                                                    <p className="text-[8px] font-black uppercase text-slate-400 mb-1">Stock</p>
                                                    <input type="number" defaultValue={p.stock} onBlur={(e)=>db.collection('productos').doc(p.id).update({stock: Number(e.target.value)})} className={`w-16 p-2 bg-white border rounded-xl font-black text-center shadow-sm outline-none focus:ring-2 ring-pink-200 ${p.stock <= 15 ? 'text-red-500' : 'text-slate-800'}`} />
                                                </div>
                                                <button onClick={() => confirm("¿Borrar?") && db.collection('productos').doc(p.id).delete()} className="ml-2 text-red-200 font-black hover:text-red-500 transition-colors">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-10 pt-8 border-t border-dashed">
                                    <h3 className="font-black text-slate-400 uppercase text-xs mb-4">Añadir Nuevo Sabor</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        <input id="new-name" className="p-4 border rounded-2xl font-black bg-slate-50 uppercase text-xs shadow-inner outline-none focus:bg-white" placeholder="NOMBRE" />
                                        <input id="new-price" type="number" className="p-4 border rounded-2xl font-black bg-slate-50 shadow-inner outline-none focus:bg-white" placeholder="PRECIO $" />
                                        <input id="new-stock" type="number" className="p-4 border rounded-2xl font-black bg-slate-50 shadow-inner outline-none focus:bg-white" placeholder="STOCK" />
                                        <select id="new-cat" className="p-4 border rounded-2xl font-black bg-white uppercase text-xs shadow-sm outline-none">
                                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={() => {
                                        const n = document.getElementById('new-name').value;
                                        const p = document.getElementById('new-price').value;
                                        const s = document.getElementById('new-stock').value;
                                        const c = document.getElementById('new-cat').value;
                                        if(n && p) {
                                            db.collection('productos').add({nombre: n.toUpperCase(), precio: Number(p), stock: Number(s), categoria: c});
                                            document.getElementById('new-name').value = ''; document.getElementById('new-price').value = '';
                                        }
                                    }} className="w-full bg-green-500 text-white py-5 rounded-[30px] font-black uppercase shadow-lg mt-4 active:scale-95 transition-all">REGISTRAR NUEVO SABOR ✅</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'history' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100">
                            <div className="bg-pink-600 p-10 rounded-[50px] mb-8 text-white text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-8 opacity-10 text-9xl font-black italic select-none">$$$</div>
                                <p className="text-xs font-black opacity-70 uppercase mb-2 italic tracking-widest relative z-10">Ventas de Hoy</p>
                                <p className="text-8xl font-black tracking-tighter leading-none relative z-10">${tickets.filter(t=>t.tipo==='Venta').reduce((a,b)=>a+b.total, 0)}</p>
                            </div>
                            <div className="space-y-4 pb-20">
                                {tickets.sort((a,b)=>b.timestamp-a.timestamp).map(t => (
                                    <div key={t.id} className={`bg-white p-7 rounded-[40px] shadow-sm border-r-[15px] transition-all hover:translate-x-1 ${t.tipo==='Venta'?'border-green-500':'border-orange-500 opacity-70'}`}>
                                        <p className="font-black text-gray-800 text-lg uppercase italic leading-none">{t.hora} • {t.vendedor}</p>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase mt-2">{t.items.map(i=>`${i.nombre}(x${i.qty})`).join(', ')}</p>
                                        <p className="text-4xl font-black text-slate-800 mt-3 tracking-tighter">${t.total}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
