<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Michoacana Pro - Blindado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes pulse-red { 0%, 100% { background-color: #ef4444; } 50% { background-color: #f87171; } }
        .animate-alert { animation: pulse-red 1.5s infinite; }
        .cart-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 40px 40px 0 0; }
        .cart-hidden { transform: translateY(calc(100% - 70px)); }
        input[type=number]::-webkit-inner-spin-button { display: none; }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans select-none text-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [products, setProducts] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [tickets, setTickets] = useState([]);
            const [cortes, setCortes] = useState([]);
            const [categories] = useState(['Paletas', 'Nieve', 'Trolly', 'Venta Libre']);
            const [cart, setCart] = useState([]);
            const [discountPct, setDiscountPct] = useState(0);
            const [catActiva, setCatActiva] = useState('Paletas');
            const [tipoVenta, setTipoVenta] = useState('Venta');
            const [showCart, setShowCart] = useState(false);
            const [pagoCon, setPagoCon] = useState('');

            useEffect(() => {
                const config = JSON.parse(localStorage.getItem('fb_config'));
                if (config && !firebase.apps.length) {
                    const app = firebase.initializeApp(config);
                    setDb(app.firestore());
                }
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsubProds = db.collection('productos').onSnapshot(s => setProducts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubEmps = db.collection('empleados').onSnapshot(s => setEmployees(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubTickets = db.collection('tickets').where('cortado', '==', false).onSnapshot(s => setTickets(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubCortes = db.collection('cortes').orderBy('timestamp', 'desc').limit(10).onSnapshot(s => setCortes(s.docs.map(d => ({id:d.id, ...d.data()}))));
                return () => { unsubProds(); unsubEmps(); unsubTickets(); unsubCortes(); };
            }, [db]);

            const subtotal = cart.reduce((a, b) => a + (Number(b.precio) * b.qty), 0);
            const totalFinal = tipoVenta === 'Venta' ? Math.round(subtotal * (1 - discountPct / 100)) : 0;
            const cambio = pagoCon ? Number(pagoCon) - totalFinal : 0;
            const totalCajaActual = tickets.filter(t=>t.tipo==='Venta').reduce((a,b)=>a+b.total, 0);

            const finalizarOperacion = async () => {
                const batch = db.batch();
                const tRef = db.collection('tickets').doc();
                batch.set(tRef, {
                    vendedor: user.nombre, items: cart, total: totalFinal, tipo: tipoVenta, 
                    descuento: discountPct, cortado: false,
                    hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                cart.forEach(item => { if(item.id !== 'libre') batch.update(db.collection('productos').doc(item.id), { stock: firebase.firestore.FieldValue.increment(-item.qty) }); });
                await batch.commit();
                setCart([]); setDiscountPct(0); setTipoVenta('Venta'); setShowCart(false); setPagoCon('');
            };

            const hacerCorteCaja = async () => {
                if(!confirm(`¿Hacer corte de caja por $${totalCajaActual}?`)) return;
                const resumenProd = {};
                tickets.forEach(t => t.items.forEach(item => resumenProd[item.nombre] = (resumenProd[item.nombre] || 0) + item.qty));
                const batch = db.batch();
                batch.set(db.collection('cortes').doc(), {
                    fecha: new Date().toLocaleDateString(), hora: new Date().toLocaleTimeString(),
                    total: totalCajaActual, responsable: user.nombre, detalle_productos: resumenProd,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                tickets.forEach(t => batch.update(db.collection('tickets').doc(t.id), { cortado: true }));
                await batch.commit();
            };

            const agregarVentaLibre = () => {
                const p = prompt("Precio:");
                const n = prompt("Nombre:");
                if(p && n) {
                    setCart([...cart, {id: 'libre', nombre: n.toUpperCase(), precio: Number(p), qty: 1, categoria: 'Venta Libre'}]);
                    setShowCart(true);
                }
            };

            if (view === 'login') return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-pink-50 p-6">
                    <h1 className="text-6xl font-black text-pink-600 mb-10 italic uppercase text-center drop-shadow-md">Michoacana</h1>
                    <div className="grid grid-cols-2 gap-4 w-full max-w-md">
                        {employees.map(e => (
                            <button key={e.id} onClick={() => {
                                const p = prompt(`PIN para ${e.nombre}:`);
                                if(p === e.pin) { setUser(e); setView('pos'); }
                            }} className="bg-white p-7 rounded-[35px] shadow-lg font-black uppercase text-gray-700 active:scale-95 transition-all">
                                {e.nombre}<p className="text-[10px] text-pink-400 font-bold tracking-widest">{e.rol}</p>
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen max-w-5xl mx-auto bg-white shadow-2xl relative overflow-hidden">
                    <nav className="bg-pink-600 p-4 text-white flex justify-between items-center z-30 shadow-md">
                        <span className="font-black italic uppercase text-lg tracking-tighter">Terminal de Punto de Venta</span>
                        <div className="flex gap-5">
                            <button onClick={() => setView('pos')} className="text-2xl active:scale-125 transition-transform">🛒</button>
                            {user.rol === 'admin' && <button onClick={() => setView('history')} className="text-2xl active:scale-125 transition-transform">📊</button>}
                            {user.rol === 'admin' && <button onClick={() => setView('admin')} className="text-2xl active:scale-125 transition-transform">📦</button>}
                            <button onClick={() => {setUser(null); setView('login');}} className="bg-pink-900 px-4 py-1.5 rounded-full text-[10px] font-black uppercase">Cerrar Sesión</button>
                        </div>
                    </nav>

                    {view === 'pos' && (
                        <div className="flex flex-col flex-1 overflow-hidden">
                            <div className="bg-slate-100 flex overflow-x-auto p-2 gap-2 border-b scroll-hide">
                                {categories.map(cat => (
                                    <button key={cat} onClick={() => cat === 'Venta Libre' ? agregarVentaLibre() : setCatActiva(cat)} 
                                    className={`px-5 py-3 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap transition-all ${catActiva === cat ? 'bg-pink-600 text-white shadow-md' : 'bg-white text-gray-400'}`}>
                                        {cat === 'Venta Libre' ? '+ Libre' : cat}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 p-4 overflow-y-auto bg-slate-50 grid grid-cols-2 sm:grid-cols-3 gap-3 content-start pb-28 scroll-hide">
                                {products.filter(p => p.categoria === catActiva).map(p => (
                                    <button key={p.id} disabled={p.stock <= 0} onClick={() => {
                                        setCart(prev => {
                                            const ex = prev.find(i => i.id === p.id);
                                            if(ex) return prev.map(i => i.id === p.id ? {...i, qty: i.qty+1} : i);
                                            return [...prev, {...p, qty: 1}];
                                        });
                                        setShowCart(true);
                                    }} className="p-5 rounded-[30px] shadow-sm bg-white relative text-left border-4 border-transparent active:border-pink-500 transition-all">
                                        <p className="font-black text-gray-900 uppercase text-[11px] leading-tight mb-1 truncate">{p.nombre}</p>
                                        <p className="text-pink-600 font-black text-2xl">${p.precio}</p>
                                        <div className={`absolute top-2 right-2 px-2 py-0.5 rounded-full text-[8px] font-black ${p.stock <= 10 ? 'animate-alert text-white' : 'bg-pink-50 text-pink-300'}`}>{p.stock}</div>
                                    </button>
                                ))}
                            </div>

                            <div className={`cart-panel fixed bottom-0 left-0 right-0 bg-white shadow-[0_-20px_60px_rgba(0,0,0,0.3)] z-40 flex flex-col max-h-[90vh] ${!showCart ? 'cart-hidden' : ''}`}>
                                <button onClick={() => setShowCart(!showCart)} className="w-full py-4 flex flex-col items-center"><div className="w-14 h-2 bg-slate-200 rounded-full mb-1"></div><span className="text-[10px] font-black text-pink-500 uppercase tracking-widest">RESUMEN DE VENTA</span></button>
                                <div className="p-6 overflow-y-auto flex-1 bg-white">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center mb-3 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                                            <div className="flex-1"><p className="font-black text-sm uppercase text-slate-700">{item.nombre}</p><p className="text-pink-500 font-bold text-xs">${item.precio} c/u</p></div>
                                            <div className="flex items-center gap-4 bg-white px-3 py-1.5 rounded-2xl border shadow-sm">
                                                <button onClick={() => setCart(prev => prev.map(i => i.id === item.id ? {...i, qty: Math.max(1, i.qty-1)} : i))} className="font-black text-red-400 text-xl">-</button>
                                                <span className="font-black text-lg">{item.qty}</span>
                                                <button onClick={() => setCart(prev => prev.map(i => i.id === item.id ? {...i, qty: i.qty+1} : i))} className="font-black text-green-400 text-xl">+</button>
                                            </div>
                                            <button onClick={() => setCart(prev => prev.filter(i => i.id !== item.id))} className="ml-4 text-red-200 text-xl">✕</button>
                                        </div>
                                    ))}
                                    
                                    <div className="mt-4 p-6 bg-slate-100 rounded-[40px] space-y-5">
                                        <div className="flex justify-between items-center">
                                            <select value={tipoVenta} onChange={(e)=>setTipoVenta(e.target.value)} className="bg-white px-4 py-2.5 rounded-2xl font-black text-[11px] uppercase text-pink-600 border shadow-sm outline-none">
                                                <option value="Venta">💰 Venta Normal</option>
                                                {user.rol === 'admin' && <option value="Merma">🚫 Merma/Dañado</option>}
                                                {user.rol === 'admin' && <option value="Consumo">🍦 Consumo Propio</option>}
                                            </select>
                                            
                                            {tipoVenta === 'Venta' && (
                                                <div className="flex gap-1.5">
                                                    {[0, 10, 30].map(pct => (
                                                        <button key={pct} onClick={() => setDiscountPct(pct)} className={`px-4 py-2 rounded-xl font-black text-[11px] border transition-all ${discountPct===pct?'bg-pink-600 text-white shadow-md':'bg-white text-slate-400'}`}>{pct}%</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex justify-between items-end border-b-2 border-slate-200 pb-4">
                                            <div className="flex flex-col"><span className="text-[10px] font-black text-slate-400 uppercase mb-1">Total a Cobrar</span><span className="text-6xl font-black text-slate-800 tracking-tighter">${totalFinal}</span></div>
                                            {discountPct > 0 && <span className="text-[10px] font-black text-pink-500 uppercase bg-pink-50 px-2 py-1 rounded-lg mb-2">Ahorro: ${subtotal - totalFinal}</span>}
                                        </div>

                                        {tipoVenta==='Venta' && (
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="flex flex-col">
                                                    <label className="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1">Pagó con:</label>
                                                    <input type="number" value={pagoCon} onChange={(e)=>setPagoCon(e.target.value)} placeholder="0" className="p-4 bg-white rounded-2xl font-black text-2xl text-slate-800 shadow-inner border-2 border-transparent focus:border-pink-300 outline-none transition-all" />
                                                </div>
                                                <div className="flex flex-col">
                                                    <label className="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1">Cambio:</label>
                                                    <div className={`p-4 rounded-2xl font-black text-2xl flex items-center justify-center shadow-sm ${cambio < 0 ? 'bg-red-50 text-red-400' : 'bg-green-50 text-green-600'}`}>${cambio >= 0 ? cambio : '---'}</div>
                                                </div>
                                            </div>
                                        )}
                                        <button onClick={finalizarOperacion} disabled={cart.length===0} className="w-full py-6 rounded-3xl bg-pink-600 text-white font-black text-3xl uppercase shadow-xl active:scale-95 transition-all">TERMINAR VENTA ✅</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'admin' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100 space-y-8 pb-10 scroll-hide">
                            <div className="bg-white p-7 rounded-[40px] shadow-sm">
                                <h2 className="font-black uppercase text-pink-600 mb-5 text-xl tracking-tighter">📑 Cortes Guardados</h2>
                                {cortes.map(c => (
                                    <div key={c.id} className="p-5 bg-slate-50 rounded-[30px] border-l-[10px] border-pink-500 mb-4">
                                        <div className="flex justify-between items-start mb-3">
                                            <div><p className="font-black text-xs uppercase text-slate-600">{c.fecha} - {c.hora}</p><p className="text-[10px] text-slate-400 font-bold">Por: {c.responsable}</p></div>
                                            <p className="text-3xl font-black text-green-600">${c.total}</p>
                                        </div>
                                        <div className="bg-white p-3 rounded-2xl border border-slate-100 space-y-1 text-[11px] font-bold uppercase text-slate-500">
                                            {c.detalle_productos && Object.entries(c.detalle_productos).map(([n, q]) => (
                                                <div key={n} className="flex justify-between border-b border-slate-50 last:border-0 py-1"><span>{n}</span><span className="text-pink-600">x{q}</span></div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="bg-white p-7 rounded-[40px] shadow-sm">
                                <h2 className="font-black uppercase text-pink-600 mb-5 text-xl tracking-tighter">🍦 Gestión de Inventario</h2>
                                {products.map(p => (
                                    <div key={p.id} className="p-4 bg-slate-50 rounded-[30px] border mb-4">
                                        <input className="font-black uppercase text-sm bg-transparent w-full mb-3 outline-none border-b border-transparent focus:border-pink-300" defaultValue={p.nombre} onBlur={(x)=>db.collection('productos').doc(p.id).update({nombre: x.target.value.toUpperCase()})} />
                                        <div className="flex justify-between items-center">
                                            <div className="flex gap-3">
                                                <div className="text-center"><p className="text-[8px] font-black text-slate-400 uppercase">Stock</p><input type="number" className="w-16 p-2 text-center font-black bg-white border rounded-xl text-xs" defaultValue={p.stock} onBlur={(x)=>db.collection('productos').doc(p.id).update({stock: Number(x.target.value)})} /></div>
                                                <div className="text-center"><p className="text-[8px] font-black text-slate-400 uppercase">Precio</p><input type="number" className="w-16 p-2 text-center font-black bg-white border rounded-xl text-xs text-pink-600" defaultValue={p.precio} onBlur={(x)=>db.collection('productos').doc(p.id).update({precio: Number(x.target.value)})} /></div>
                                            </div>
                                            <button onClick={() => confirm("¿Borrar?") && db.collection('productos').doc(p.id).delete()} className="text-red-200 font-black text-xl">✕</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'history' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100 scroll-hide">
                            <div className="bg-pink-600 p-10 rounded-[50px] mb-8 text-white text-center shadow-2xl">
                                <p className="text-[10px] font-black opacity-70 uppercase mb-2">Dinero en Caja</p>
                                <p className="text-8xl font-black tracking-tighter mb-6">${totalCajaActual}</p>
                                <button onClick={hacerCorteCaja} className="bg-white text-pink-600 px-8 py-4 rounded-3xl font-black text-xs uppercase shadow-xl active:scale-95 transition-all">Realizar Corte de Caja 💰</button>
                            </div>
                            <div className="space-y-4 pb-24">
                                <p className="font-black uppercase text-slate-400 text-[10px] ml-5 tracking-widest italic">Ventas del Turno:</p>
                                {tickets.sort((a,b)=>b.timestamp-a.timestamp).map(t => (
                                    <div key={t.id} className="bg-white p-6 rounded-[35px] border-r-[12px] border-green-500 shadow-sm flex justify-between items-center">
                                        <div className="flex-1 pr-2">
                                            <div className="flex items-center gap-2 mb-1"><span className="font-black text-[12px] uppercase">{t.hora}</span><span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded-lg text-slate-500 font-bold">{t.vendedor}</span></div>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase italic leading-tight">{t.items.map(i=>`${i.nombre} x${i.qty}`).join(', ')}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-3xl font-black tracking-tighter">${t.total}</p>
                                            {t.descuento > 0 && <p className="text-[9px] font-black text-pink-500 uppercase tracking-tighter">-{t.descuento}%</p>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
