<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Michoacana Pro - Corte Detallado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes pulse-red { 0%, 100% { background-color: #ef4444; } 50% { background-color: #f87171; } }
        .animate-alert { animation: pulse-red 1.5s infinite; }
        .cart-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 40px 40px 0 0; }
        .cart-hidden { transform: translateY(calc(100% - 70px)); }
        input[type=number]::-webkit-inner-spin-button { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans select-none text-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [products, setProducts] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [tickets, setTickets] = useState([]);
            const [cortes, setCortes] = useState([]);
            const [categories] = useState(['Paletas', 'Nieve', 'Trolly', 'Venta Libre']);
            const [cart, setCart] = useState([]);
            const [discountPct, setDiscountPct] = useState(0);
            const [catActiva, setCatActiva] = useState('Paletas');
            const [tipoVenta, setTipoVenta] = useState('Venta');
            const [showCart, setShowCart] = useState(false);
            const [pagoCon, setPagoCon] = useState('');

            useEffect(() => {
                const config = JSON.parse(localStorage.getItem('fb_config'));
                if (config && !firebase.apps.length) {
                    const app = firebase.initializeApp(config);
                    setDb(app.firestore());
                }
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsubProds = db.collection('productos').onSnapshot(s => setProducts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubEmps = db.collection('empleados').onSnapshot(s => setEmployees(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubTickets = db.collection('tickets').where('cortado', '==', false).onSnapshot(s => setTickets(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubCortes = db.collection('cortes').orderBy('timestamp', 'desc').limit(15).onSnapshot(s => setCortes(s.docs.map(d => ({id:d.id, ...d.data()}))));
                return () => { unsubProds(); unsubEmps(); unsubTickets(); unsubCortes(); };
            }, [db]);

            const subtotal = cart.reduce((a, b) => a + (Number(b.precio) * b.qty), 0);
            const totalFinal = tipoVenta === 'Venta' ? Math.round(subtotal * (1 - discountPct / 100)) : 0;
            const cambio = pagoCon ? Number(pagoCon) - totalFinal : 0;
            const totalCajaActual = tickets.filter(t=>t.tipo==='Venta').reduce((a,b)=>a+b.total, 0);

            const finalizarOperacion = async () => {
                const batch = db.batch();
                const tRef = db.collection('tickets').doc();
                batch.set(tRef, {
                    vendedor: user.nombre, items: cart, total: totalFinal, tipo: tipoVenta, 
                    descuento: discountPct, cortado: false,
                    hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                cart.forEach(item => { if(item.id !== 'libre') batch.update(db.collection('productos').doc(item.id), { stock: firebase.firestore.FieldValue.increment(-item.qty) }); });
                await batch.commit();
                setCart([]); setDiscountPct(0); setTipoVenta('Venta'); setShowCart(false); setPagoCon('');
            };

            const hacerCorteCaja = async () => {
                if(!confirm(`¿Hacer corte por $${totalCajaActual}? Se guardará el detalle de productos vendidos.`)) return;
                
                // Resumen de qué se vendió
                const resumenProd = {};
                tickets.forEach(t => {
                    t.items.forEach(item => {
                        resumenProd[item.nombre] = (resumenProd[item.nombre] || 0) + item.qty;
                    });
                });

                const batch = db.batch();
                batch.set(db.collection('cortes').doc(), {
                    fecha: new Date().toLocaleDateString(),
                    hora: new Date().toLocaleTimeString(),
                    total: totalCajaActual,
                    responsable: user.nombre,
                    detalle_productos: resumenProd,
                    cantidad_tickets: tickets.length,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                tickets.forEach(t => batch.update(db.collection('tickets').doc(t.id), { cortado: true }));
                await batch.commit();
                alert("Corte guardado con éxito.");
            };

            if (view === 'login') return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-pink-100 p-6">
                    <h1 className="text-5xl font-black text-pink-600 mb-10 italic uppercase text-center">Michoacana</h1>
                    <div className="grid grid-cols-2 gap-4 w-full max-w-md">
                        {employees.map(e => (
                            <button key={e.id} onClick={() => {
                                const p = prompt(`PIN para ${e.nombre}:`);
                                if(p === e.pin) { setUser(e); setView('pos'); }
                            }} className="bg-white p-6 rounded-[30px] shadow-lg font-black uppercase text-gray-700">
                                {e.nombre}
                                <p className="text-[10px] text-pink-400">{e.rol}</p>
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen max-w-5xl mx-auto bg-white shadow-2xl relative overflow-hidden">
                    <nav className="bg-pink-600 p-4 text-white flex justify-between items-center z-30">
                        <span className="font-black italic uppercase text-xl">Michoacana</span>
                        <div className="flex gap-4">
                            <button onClick={() => setView('pos')} className="text-2xl">🛒</button>
                            {(user.rol === 'admin' || user.rol === 'encargado') && <button onClick={() => setView('history')} className="text-2xl">📊</button>}
                            {user.rol === 'admin' && <button onClick={() => setView('admin')} className="text-2xl">📦</button>}
                            <button onClick={() => {setUser(null); setView('login');}} className="bg-pink-900 px-3 py-1 rounded-full text-[10px] font-black uppercase">Salir</button>
                        </div>
                    </nav>

                    {view === 'pos' && (
                        <div className="flex flex-col flex-1 overflow-hidden">
                            <div className="bg-slate-100 flex overflow-x-auto p-2 gap-2 border-b">
                                {categories.map(cat => (
                                    <button key={cat} onClick={() => setCatActiva(cat)} className={`px-4 py-2 rounded-xl font-black text-[10px] uppercase whitespace-nowrap ${catActiva === cat ? 'bg-pink-600 text-white' : 'bg-white text-gray-400'}`}>{cat}</button>
                                ))}
                            </div>
                            <div className="flex-1 p-4 overflow-y-auto bg-slate-50 grid grid-cols-2 sm:grid-cols-3 gap-3 content-start pb-24">
                                {products.filter(p => p.categoria === catActiva).map(p => (
                                    <button key={p.id} disabled={p.stock <= 0} onClick={() => {
                                        setCart(prev => {
                                            const ex = prev.find(i => i.id === p.id);
                                            if(ex) return prev.map(i => i.id === p.id ? {...i, qty: i.qty+1} : i);
                                            return [...prev, {...p, qty: 1}];
                                        });
                                        setShowCart(true);
                                    }} className="p-4 rounded-[25px] shadow-sm bg-white relative text-left border-2 border-transparent active:border-pink-500">
                                        <p className="font-black text-gray-900 uppercase text-xs leading-tight mb-1">{p.nombre}</p>
                                        <p className="text-pink-600 font-black text-xl">${p.precio}</p>
                                        <div className={`absolute top-2 right-2 px-2 py-0.5 rounded-full text-[8px] font-black ${p.stock <= 10 ? 'animate-alert text-white' : 'bg-pink-50 text-pink-300'}`}>{p.stock}</div>
                                    </button>
                                ))}
                            </div>

                            <div className={`cart-panel fixed bottom-0 left-0 right-0 bg-white shadow-[0_-15px_40px_rgba(0,0,0,0.2)] z-40 flex flex-col max-h-[85vh] ${!showCart ? 'cart-hidden' : ''}`}>
                                <button onClick={() => setShowCart(!showCart)} className="w-full py-3 flex flex-col items-center"><div className="w-12 h-1 bg-slate-200 rounded-full mb-1"></div><span className="text-[10px] font-black text-pink-500 uppercase">CARRITO</span></button>
                                <div className="p-5 overflow-y-auto flex-1">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center mb-3 bg-slate-50 p-3 rounded-2xl">
                                            <div className="flex-1"><p className="font-black text-xs uppercase">{item.nombre}</p><p className="text-pink-500 font-bold text-[10px]">${item.precio}</p></div>
                                            <div className="flex items-center gap-3 bg-white px-2 py-1 rounded-xl border">
                                                <button onClick={() => setCart(prev => prev.map(i => i.id === item.id ? {...i, qty: Math.max(1, i.qty-1)} : i))} className="font-black text-red-400">-</button>
                                                <span className="font-black text-sm">{item.qty}</span>
                                                <button onClick={() => setCart(prev => prev.map(i => i.id === item.id ? {...i, qty: i.qty+1} : i))} className="font-black text-green-400">+</button>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="mt-2 p-4 bg-slate-100 rounded-[30px] space-y-4">
                                        <div className="flex justify-between items-end"><div className="flex flex-col"><span className="text-[10px] font-black text-slate-400 uppercase">Total</span><span className="text-5xl font-black text-slate-800">${totalFinal}</span></div></div>
                                        {tipoVenta==='Venta' && (
                                            <div className="grid grid-cols-2 gap-3">
                                                <input type="number" value={pagoCon} onChange={(e)=>setPagoCon(e.target.value)} placeholder="Pagó con..." className="p-3 bg-white rounded-xl font-black text-xl outline-none border-2 border-transparent focus:border-pink-300" />
                                                <div className={`p-3 rounded-xl font-black text-xl flex items-center justify-center ${cambio < 0 ? 'bg-red-50 text-red-400' : 'bg-green-50 text-green-600'}`}>${cambio >= 0 ? cambio : '...'}</div>
                                            </div>
                                        )}
                                        <button onClick={finalizarOperacion} disabled={cart.length===0} className="w-full py-4 rounded-2xl bg-pink-600 text-white font-black text-2xl uppercase">Cobrar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'admin' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100 space-y-8 pb-10">
                            {/* HISTORIAL DE CORTES CON DETALLE */}
                            <div className="bg-white p-6 rounded-[35px] shadow-sm">
                                <h2 className="font-black uppercase text-pink-600 mb-4 tracking-tighter">📑 Historial de Cortes Detallados</h2>
                                <div className="space-y-4">
                                    {cortes.map(c => (
                                        <div key={c.id} className="p-4 bg-slate-50 rounded-2xl border-l-4 border-pink-500 shadow-sm">
                                            <div className="flex justify-between items-start mb-2">
                                                <div>
                                                    <p className="font-black text-xs uppercase">{c.fecha} - {c.hora}</p>
                                                    <p className="text-[9px] text-slate-400 font-bold uppercase">Hecho por: {c.responsable}</p>
                                                </div>
                                                <p className="text-2xl font-black text-green-600">${c.total}</p>
                                            </div>
                                            <div className="bg-white p-3 rounded-xl border border-slate-100">
                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1 border-b pb-1">Productos Vendidos:</p>
                                                {c.detalle_productos && Object.entries(c.detalle_productos).map(([nom, cant]) => (
                                                    <div key={nom} className="flex justify-between text-[10px] font-bold py-0.5 border-b border-slate-50 last:border-0">
                                                        <span className="uppercase">{nom}</span>
                                                        <span className="text-pink-600">x{cant}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* GESTIÓN DE PERSONAL */}
                            <div className="bg-white p-6 rounded-[35px] shadow-sm">
                                <h2 className="font-black uppercase text-pink-600 mb-4">👥 Personal (Nombre y PIN)</h2>
                                {employees.map(e => (
                                    <div key={e.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border mb-2">
                                        <input className="font-black uppercase text-sm bg-transparent w-full outline-none" defaultValue={e.nombre} onBlur={(x)=>db.collection('empleados').doc(e.id).update({nombre: x.target.value.toUpperCase()})} />
                                        <input className="w-16 p-1 text-center font-black bg-white border rounded-lg text-xs ml-2" defaultValue={e.pin} onBlur={(x)=>db.collection('empleados').doc(e.id).update({pin: x.target.value})} />
                                        <button onClick={() => confirm("¿Eliminar?") && db.collection('empleados').doc(e.id).delete()} className="ml-2 text-red-300">✕</button>
                                    </div>
                                ))}
                                <button onClick={()=>{const n=prompt("Nombre:"); const p=prompt("PIN:"); if(n&&p) db.collection('empleados').add({nombre:n.toUpperCase(), pin:p, rol:'vendedor'})}} className="w-full py-2 mt-2 border-2 border-dashed border-pink-200 text-pink-500 rounded-xl font-black text-xs">+ NUEVO EMPLEADO</button>
                            </div>

                            {/* GESTIÓN DE PRODUCTOS */}
                            <div className="bg-white p-6 rounded-[35px] shadow-sm">
                                <h2 className="font-black uppercase text-pink-600 mb-4">🍦 Inventario</h2>
                                {products.map(p => (
                                    <div key={p.id} className="p-3 bg-slate-50 rounded-2xl border mb-3">
                                        <input className="font-black uppercase text-xs bg-transparent w-full mb-2 outline-none border-b border-pink-100" defaultValue={p.nombre} onBlur={(x)=>db.collection('productos').doc(p.id).update({nombre: x.target.value.toUpperCase()})} />
                                        <div className="flex justify-between items-center">
                                            <div className="flex gap-2">
                                                <div className="text-center"><p className="text-[7px] font-black text-slate-400">STOCK</p><input type="number" className="w-12 p-1 text-center font-black bg-white border rounded-lg text-xs" defaultValue={p.stock} onBlur={(x)=>db.collection('productos').doc(p.id).update({stock: Number(x.target.value)})} /></div>
                                                <div className="text-center"><p className="text-[7px] font-black text-slate-400">PRECIO</p><input type="number" className="w-12 p-1 text-center font-black bg-white border rounded-lg text-xs text-pink-600" defaultValue={p.precio} onBlur={(x)=>db.collection('productos').doc(p.id).update({precio: Number(x.target.value)})} /></div>
                                            </div>
                                            <button onClick={() => confirm("¿Borrar?") && db.collection('productos').doc(p.id).delete()} className="text-red-200">✕</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'history' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100">
                            <div className="bg-pink-600 p-8 rounded-[40px] mb-6 text-white text-center shadow-xl">
                                <p className="text-[10px] font-black opacity-70 uppercase mb-2">Total en Caja Ahora</p>
                                <p className="text-7xl font-black tracking-tighter mb-4">${totalCajaActual}</p>
                                {user.rol === 'admin' && <button onClick={hacerCorteCaja} className="bg-white text-pink-600 px-6 py-3 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95">Realizar Corte del Día 💰</button>}
                            </div>
                            <div className="space-y-3 pb-20">
                                <p className="font-black uppercase text-slate-400 text-[10px] ml-4">Ventas sin cortar ({tickets.length}):</p>
                                {tickets.sort((a,b)=>b.timestamp-a.timestamp).map(t => (
                                    <div key={t.id} className={`bg-white p-4 rounded-[25px] border-r-8 shadow-sm ${t.tipo==='Venta'?'border-green-500':'border-orange-400'}`}>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <p className="font-black text-[11px] uppercase">{t.hora} - {t.vendedor}</p>
                                                <p className="text-[9px] text-slate-400 font-bold uppercase italic">{t.items.map(i=>`${i.nombre} x${i.qty}`).join(', ')}</p>
                                            </div>
                                            <p className="text-2xl font-black">${t.total}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
