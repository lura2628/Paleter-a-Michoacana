<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Michoacana Ultimate POS</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

            50% { background-color: #f87171; }
        }
        .animate-alert {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans select-none text-slate-900">
    <div id="root"></div>

                return (

                            <h2 className="text-3xl font-black mb-6 text-pink-600 uppercase italic">Configuración</h2>
                            <textarea id="cuadro_llaves" className="w-full h-48 p-4 border rounded-3xl mb-4 font-mono text-[10px] bg-slate-50 outline-none" placeholder="Pega las llaves aquí..."></textarea>
                            <button onClick={() => {
                                const texto = document.getElementById('cuadro_llaves').value;
                                if(texto.includes("apiKey")) { localStorage.setItem('fb_config', texto); window.location.reload(); }
                            }} className="w-full bg-pink-600 text-white py-5 rounded-3xl font-black uppercase text-xl shadow-lg">Activar Sistema</button>
                        </div>
                    </div>
                );
            }

                try {
                    const config = JSON.parse(configGuardada);
                    if (config && !firebase.apps.length) {
                        const app = firebase.initializeApp(config);
                        setDb(app.firestore());
                    }
                } catch(e) { localStorage.removeItem('fb_config'); window.location.reload(); }
