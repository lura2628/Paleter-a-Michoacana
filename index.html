<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Michoacana Pro Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes pulse-red { 0%, 100% { background-color: #ef4444; } 50% { background-color: #f87171; } }
        .animate-alert { animation: pulse-red 1.5s infinite; }
        .cart-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-hidden { transform: translateY(calc(100% - 60px)); }
    </style>
</head>
<body class="bg-slate-50 font-sans select-none text-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [products, setProducts] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [tickets, setTickets] = useState([]);
            const [categories, setCategories] = useState(['Paletas', 'Nieve', 'Trolly', 'Venta Libre']);
            const [cart, setCart] = useState([]);
            const [discountPct, setDiscountPct] = useState(0);
            const [catActiva, setCatActiva] = useState('Paletas');
            const [tipoVenta, setTipoVenta] = useState('Venta');
            const [showCart, setShowCart] = useState(false);

            useEffect(() => {
                const config = JSON.parse(localStorage.getItem('fb_config'));
                if (config && !firebase.apps.length) {
                    const app = firebase.initializeApp(config);
                    setDb(app.firestore());
                }
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsubProds = db.collection('productos').onSnapshot(s => setProducts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubEmps = db.collection('empleados').onSnapshot(s => setEmployees(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubCats = db.collection('config').doc('categorias').onSnapshot(doc => doc.exists && setCategories(doc.data().lista));
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                const unsubTickets = db.collection('tickets').where('timestamp', '>=', hoy).onSnapshot(s => setTickets(s.docs.map(d => ({id:d.id, ...d.data()}))));
                return () => { unsubProds(); unsubEmps(); unsubCats(); unsubTickets(); };
            }, [db]);

            const subtotal = cart.reduce((a, b) => a + (Number(b.precio) * b.qty), 0);
            const totalFinal = tipoVenta === 'Venta' ? Math.round(subtotal * (1 - discountPct / 100)) : 0;

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => 
                    item.id === id ? { ...item, qty: Math.max(1, item.qty + delta) } : item
                ));
            };

            const finalizarOperacion = async () => {
                const batch = db.batch();
                const tRef = db.collection('tickets').doc();
                batch.set(tRef, {
                    vendedor: user.nombre, items: cart, total: totalFinal, tipo: tipoVenta, valor_merma: tipoVenta !== 'Venta' ? subtotal : 0,
                    hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                cart.forEach(item => { if(item.id !== 'libre') batch.update(db.collection('productos').doc(item.id), { stock: firebase.firestore.FieldValue.increment(-item.qty) }); });
                await batch.commit();
                setCart([]); setDiscountPct(0); setTipoVenta('Venta'); setShowCart(false);
            };

            if (view === 'login') return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-pink-100 p-6">
                    <h1 className="text-6xl font-black text-pink-600 mb-10 italic uppercase">Michoacana</h1>
                    <div className="grid grid-cols-2 gap-4 w-full max-w-md">
                        {employees.map(e => (
                            <button key={e.id} onClick={() => {
                                const p = prompt(`PIN para ${e.nombre}:`);
                                if(p === e.pin) { setUser(e); setView('pos'); }
                            }} className="bg-white p-8 rounded-3xl shadow-lg font-black uppercase text-gray-700">
                                {e.nombre}
                                <p className="text-[10px] text-pink-400 font-bold">{e.rol}</p>
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen max-w-5xl mx-auto bg-white shadow-2xl overflow-hidden relative">
                    <nav className="bg-pink-600 p-4 text-white flex justify-between items-center z-30">
                        <span className="font-black italic uppercase text-2xl">Michoacana</span>
                        <div className="flex gap-4">
                            <button onClick={() => setView('pos')} className="text-2xl">🛒</button>
                            {(user.rol === 'admin' || user.rol === 'encargado') && <button onClick={() => setView('history')} className="text-2xl">📊</button>}
                            {user.rol === 'admin' && <button onClick={() => setView('admin')} className="text-2xl">📦</button>}
                            <button onClick={() => {setUser(null); setView('login');}} className="bg-black text-white px-4 py-1 rounded-full text-xs font-black">SALIR</button>
                        </div>
                    </nav>

                    {view === 'pos' && (
                        <div className="flex flex-col flex-1 overflow-hidden">
                            <div className="bg-slate-100 flex overflow-x-auto p-2 gap-2 border-b">
                                {categories.map(cat => (
                                    <button key={cat} onClick={() => cat === 'Venta Libre' ? alert("Usa el menú Admin para agregar productos libres") : setCatActiva(cat)} className={`px-6 py-3 rounded-2xl font-black text-xs uppercase whitespace-nowrap ${catActiva === cat ? 'bg-pink-600 text-white' : 'bg-white text-gray-400'}`}>
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            <div className="flex-1 p-4 overflow-y-auto bg-slate-50 grid grid-cols-2 sm:grid-cols-3 gap-3 content-start pb-24">
                                {products.filter(p => p.categoria === catActiva).map(p => (
                                    <button key={p.id} disabled={p.stock <= 0} onClick={() => {
                                        setCart(prev => {
                                            const ex = prev.find(i => i.id === p.id);
                                            if(ex) return prev.map(i => i.id === p.id ? {...i, qty: i.qty+1} : i);
                                            return [...prev, {...p, qty: 1}];
                                        });
                                        setShowCart(true);
                                    }} className="p-4 rounded-3xl shadow-sm bg-white border-2 border-transparent active:border-pink-500 relative text-left">
                                        <p className="font-black text-gray-900 leading-tight uppercase text-sm mb-1">{p.nombre}</p>
                                        <p className="text-pink-600 font-black text-xl">${p.precio}</p>
                                        <div className={`absolute top-2 right-2 px-2 py-0.5 rounded-full text-[9px] font-black ${p.stock <= 15 ? 'animate-alert text-white' : 'bg-pink-50 text-pink-400'}`}>
                                            {p.stock}
                                        </div>
                                    </button>
                                ))}
                            </div>

                            {/* PANEL DE CARRITO DESLIZABLE */}
                            <div className={`cart-panel fixed bottom-0 left-0 right-0 bg-white shadow-[0_-10px_30px_rgba(0,0,0,0.1)] rounded-t-[40px] z-40 flex flex-col max-h-[85vh] ${!showCart ? 'cart-hidden' : ''}`}>
                                <button onClick={() => setShowCart(!showCart)} className="w-full py-4 flex flex-col items-center">
                                    <div className="w-12 h-1.5 bg-slate-200 rounded-full mb-2"></div>
                                    <span className="font-black text-[10px] text-slate-400 uppercase tracking-widest">
                                        {showCart ? 'Bajar Panel' : `Ver Carrito (${cart.length})`}
                                    </span>
                                </button>
                                
                                <div className="p-6 overflow-y-auto flex-1">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center mb-4 bg-slate-50 p-4 rounded-3xl">
                                            <div className="flex-1">
                                                <p className="font-black text-sm uppercase">{item.nombre}</p>
                                                <p className="text-pink-500 font-bold text-xs">${item.precio} c/u</p>
                                            </div>
                                            <div className="flex items-center gap-3 bg-white p-2 rounded-2xl shadow-sm">
                                                <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 font-black text-xl text-red-400">-</button>
                                                <span className="font-black text-lg w-6 text-center">{item.qty}</span>
                                                <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 font-black text-xl text-green-400">+</button>
                                            </div>
                                            <button onClick={() => setCart(prev => prev.filter(i => i.id !== item.id))} className="ml-4 text-slate-300 font-black">✕</button>
                                        </div>
                                    ))}
                                    
                                    <div className="mt-6 border-t pt-6">
                                        <div className="flex justify-between items-end mb-6 italic">
                                            <div className="flex flex-col">
                                                <span className="text-[10px] font-black text-slate-400 uppercase">Total Final</span>
                                                <span className="text-5xl font-black text-slate-800">${totalFinal}</span>
                                            </div>
                                            {(user.rol === 'admin' || user.rol === 'encargado') && (
                                                <select value={tipoVenta} onChange={(e)=>setTipoVenta(e.target.value)} className="text-[10px] font-black p-2 border rounded-xl uppercase text-pink-600">
                                                    <option value="Venta">💰 Venta</option>
                                                    <option value="Merma">🚫 Merma</option>
                                                </select>
                                            )}
                                        </div>
                                        <button onClick={finalizarOperacion} disabled={cart.length===0} className="w-full py-6 rounded-3xl bg-pink-600 text-white font-black text-2xl shadow-xl shadow-pink-100 uppercase">COBRAR</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'admin' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100 space-y-8 pb-10">
                            {/* GESTIÓN DE EMPLEADOS */}
                            <div className="bg-white p-6 rounded-[35px] shadow-sm">
                                <h2 className="text-xl font-black uppercase italic text-pink-600 mb-6">Personal del Negocio</h2>
                                <div className="space-y-3">
                                    {employees.map(e => (
                                        <div key={e.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border">
                                            <div>
                                                <p className="font-black uppercase text-sm">{e.nombre}</p>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{e.rol} • PIN: {e.pin}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => {
                                                    const nNom = prompt("Nuevo nombre:", e.nombre);
                                                    const nPin = prompt("Nuevo PIN:", e.pin);
                                                    const nRol = prompt("Nuevo Puesto (admin/encargado/vendedor):", e.rol);
                                                    if(nNom && nPin && nRol) db.collection('empleados').doc(e.id).update({nombre: nNom.toUpperCase(), pin: nPin, rol: nRol});
                                                }} className="bg-blue-50 text-blue-500 p-2 rounded-xl text-[10px] font-black">EDITAR</button>
                                                <button onClick={() => confirm("¿Eliminar empleado?") && db.collection('empleados').doc(e.id).delete()} className="bg-red-50 text-red-500 p-2 rounded-xl text-[10px] font-black">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => {
                                        const n = prompt("Nombre:"); const p = prompt("PIN:"); const r = prompt("Puesto:");
                                        if(n && p && r) db.collection('empleados').add({nombre: n.toUpperCase(), pin: p, rol: r});
                                    }} className="w-full py-4 rounded-2xl border-2 border-dashed border-pink-200 text-pink-500 font-black uppercase text-xs">+ Agregar Empleado</button>
                                </div>
                            </div>

                            {/* ALTA PRODUCTOS */}
                            <div className="bg-white p-6 rounded-[35px] shadow-sm">
                                <h2 className="text-xl font-black uppercase italic text-pink-600 mb-4 tracking-tighter">Registrar Mercancía</h2>
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <input id="new-name" className="p-4 border rounded-2xl font-black bg-slate-50 uppercase text-xs" placeholder="NOMBRE SABOR" />
                                    <input id="new-price" type="number" className="p-4 border rounded-2xl font-black bg-slate-50" placeholder="PRECIO $" />
                                    <input id="new-stock" type="number" className="p-4 border rounded-2xl font-black bg-slate-50" placeholder="STOCK" />
                                    <select id="new-cat" className="p-4 border rounded-2xl font-black bg-white uppercase text-xs">
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <button onClick={() => {
                                    const n = document.getElementById('new-name').value;
                                    const p = document.getElementById('new-price').value;
                                    const s = document.getElementById('new-stock').value;
                                    const c = document.getElementById('new-cat').value;
                                    if(n && p) {
                                        db.collection('productos').add({nombre: n.toUpperCase(), precio: Number(p), stock: Number(s), categoria: c});
                                        document.getElementById('new-name').value = ''; document.getElementById('new-price').value = '';
                                    }
                                }} className="w-full bg-green-500 text-white py-4 rounded-2xl font-black uppercase shadow-lg shadow-green-100">GUARDAR ✅</button>
                            </div>
                        </div>
                    )}

                    {view === 'history' && (
                        <div className="flex-1 p-6 overflow-y-auto bg-slate-100">
                            <div className="bg-pink-600 p-8 rounded-[40px] mb-6 text-white text-center shadow-xl">
                                <p className="text-xs font-black opacity-70 uppercase mb-2 italic tracking-widest">Efectivo en Caja Hoy</p>
                                <p className="text-7xl font-black tracking-tighter leading-none">${tickets.filter(t=>t.tipo==='Venta').reduce((a,b)=>a+b.total, 0)}</p>
                            </div>
                            <div className="space-y-4 pb-20">
                                {tickets.sort((a,b)=>b.timestamp-a.timestamp).map(t => (
                                    <div key={t.id} className={`bg-white p-6 rounded-[30px] shadow-sm border-r-[15px] ${t.tipo==='Venta'?'border-green-500':'border-orange-400'}`}>
                                        <p className="font-black text-gray-800 text-lg uppercase italic leading-none">{t.hora} • {t.vendedor}</p>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase mt-2 tracking-tighter">{t.items.map(i=>`${i.nombre}(x${i.qty})`).join(', ')}</p>
                                        <p className="text-3xl font-black text-slate-800 mt-2 tracking-tighter">${t.total}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
